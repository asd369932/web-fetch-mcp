[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-fetch-mcp"
version = "0.1.0"
description = "MCP server that fetches web pages and JSON APIs as clean text, with SSRF protection, size caps and timeouts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mcp", "web", "fetch", "scraping", "ssrf", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["mcp>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
web-fetch-mcp = "web_fetch_mcp.server:main"

[project.urls]
Homepage = "https://github.com/asd369932/web-fetch-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/web_fetch_mcp"]
